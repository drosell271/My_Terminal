services:
  my-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-terminal:latest
    pull_policy: build
    container_name: my_terminal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      TZ: ${TZ:-Europe/Madrid}
      DB_FILE: /data/app.sqlite
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EINK_RENDER_URL: ${EINK_RENDER_URL:-}
      PUPPETEER_CACHE_DIR: /app/.cache/puppeteer
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - ${DATA_PATH:-/home/daniel/docker/my_terminal/data}:/data
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const port=process.env.PORT||3000; fetch('http://127.0.0.1:'+port+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
